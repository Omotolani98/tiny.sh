apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tiny-sh.fullname" . }}
  labels:
    app: {{ include "tiny-sh.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "tiny-sh.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "tiny-sh.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 42000
          volumeMounts:
            - name: ssh-keys
              mountPath: /app/.ssh
              readOnly: true
      volumes:
        - name: ssh-keys
          secret:
            secretName: tiny-sh-ssh
